name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_BUILD_JOBS: '4'
  CI_SUITE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'smoke' }}

jobs:
  policy:
    name: Contribution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR title and commit subjects
        run: python3 scripts/check_contribution.py

      - name: Check SDK filesystem safety
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  native:
    name: Native (${{ matrix.platform }})
    needs: policy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows-x86_64-msvc
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      LYRA_CI_EXPECTED_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Identify pinned source download
        id: llvm_source
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from build_llvm import SHA256; print('sha256=' + SHA256)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned LLVM source download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lyra-toolchain/downloads/llvm-project-*.src.tar.xz
          key: llvm-source-${{ runner.os }}-${{ steps.llvm_source.outputs.sha256 }}

      - name: Install and verify native toolchains
        timeout-minutes: 45
        run: |
          mkdir -p "$RUNNER_TEMP/lyra-ci-logs"
          python scripts/setup_ci.py 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/setup.log"

      - name: Cache Cargo downloads only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ matrix.platform }}-

      - name: Fetch locked dependencies
        timeout-minutes: 15
        run: |
          cargo fetch --locked --target "$LYRA_CI_EXPECTED_TARGET" 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/fetch-root.log"
          cargo fetch --locked --target "$LYRA_CI_EXPECTED_TARGET" --manifest-path test_project/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/fetch-bin.log"
          cargo fetch --locked --target "$LYRA_CI_EXPECTED_TARGET" --manifest-path test_dll_project/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/fetch-dll.log"

      - name: Check Rust formatting
        if: matrix.platform == 'linux-x86_64'
        timeout-minutes: 5
        run: cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/fmt.log"

      - name: Build all native binaries
        timeout-minutes: 20
        run: cargo build --locked --bins 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/build.log"

      - name: Test all native binaries
        id: native_tests
        timeout-minutes: 15
        run: cargo test --locked --bins 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/test.log"

      - name: Diagnose failed Windows tests serially
        if: failure() && matrix.platform == 'windows-x86_64-msvc' && steps.native_tests.outcome == 'failure'
        timeout-minutes: 15
        run: cargo test --locked --bins -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/test-serial-diagnostic.log"

      - name: Exercise public projects
        timeout-minutes: 60
        run: python scripts/ci_smoke.py --suite "$CI_SUITE" --output "$RUNNER_TEMP/lyra-smoke" 2>&1 | tee "$RUNNER_TEMP/lyra-ci-logs/smoke.log"

      - name: Summarize results
        if: always()
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          report = Path(os.environ['RUNNER_TEMP']) / 'lyra-smoke/report.json'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f"## {os.environ['LYRA_CI_EXPECTED_TARGET']} ({os.environ['CI_SUITE']})\n\n")
              if report.is_file():
                  data = json.loads(report.read_text(encoding='utf-8'))
                  counts = collections.Counter(item['status'] for item in data['results'])
                  summary.write(f"Passed: **{counts['passed']}**; failed: **{counts['failed']}**.\n\n")
                  summary.write('Versions: `' + json.dumps(data['versions'], sort_keys=True) + '`\n')
              else:
                  summary.write('Smoke report unavailable: inspect setup/build/test logs and the failed step.\n')
          PY

      - name: Upload diagnostic evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lyra-ci-logs/
            ${{ runner.temp }}/lyra-smoke/
            ${{ runner.temp }}/lyra-toolchain/private/logs/
            !${{ runner.temp }}/lyra-smoke/**/target/**
            !${{ runner.temp }}/lyra-smoke/**/.git/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  required:
    name: CI required
    if: always()
    needs: [policy, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require policy and every native platform
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          if [ "$POLICY_RESULT" != success ]; then
            echo "Contribution policy did not succeed: $POLICY_RESULT"
            exit 1
          fi
          if [ "$NATIVE_RESULT" != success ]; then
            echo "Native matrix did not fully succeed: $NATIVE_RESULT"
            exit 1
          fi
          echo 'Contribution policy and all three native platforms passed.' >> "$GITHUB_STEP_SUMMARY"
