[package]
name = "lyra"
version = "0.1.0"
authors = ["Lyra Contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
description = "LLVM-based code obfuscator for Rust"
readme = "README.md"
keywords = [
    "obfuscation",
    "llvm",
    "security",
    "reverse-engineering",
    "protection",
]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "lyra"
path = "src/main.rs"

[[bin]]
name = "lyra_linker"
path = "src/bin/lyra_linker.rs"

[[bin]]
name = "lyra_wrapper"
path = "src/bin/lyra_wrapper.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.2"
# Enable only the targets included in the supported LLVM SDK.
inkwell = { version = "0.11", default-features = false, features = [
    "llvm23-1",
    "target-x86",
    "target-arm",
    "target-aarch64",
    "target-riscv",
    "target-bpf",
    "target-nvptx",
    "target-webassembly",
] }
either = "1.13"
llvm-sys = { version = "231", features = ["force-static"] }
cc = "1"

[build-dependencies]
cc = "1"
shlex = "1.3"

[workspace]
exclude = ["test_project", "test_dll_project", "test_workspace_project"]
